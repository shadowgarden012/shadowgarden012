<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 56" width="100%" height="100%">
  <defs>
    <style>
      .bar {
        transform-origin: center bottom;
        transform-box: fill-box;
        animation: eq 1.4s ease-in-out infinite alternate;
      }
      .b1 { animation-delay: 0.0s; animation-duration: 1.1s; }
      .b2 { animation-delay: 0.2s; animation-duration: 1.5s; }
      .b3 { animation-delay: 0.4s; animation-duration: 0.9s; }
      .b4 { animation-delay: 0.1s; animation-duration: 1.3s; }
      .b5 { animation-delay: 0.5s; animation-duration: 1.0s; }
      .b6 { animation-delay: 0.3s; animation-duration: 1.6s; }
      .b7 { animation-delay: 0.6s; animation-duration: 1.2s; }
      .txt {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 3px;
        fill: #BB86FC;
        opacity: 0.85;
      }
      @keyframes eq {
        0%   { transform: scaleY(0.28); opacity: 0.45; }
        100% { transform: scaleY(1); opacity: 1; }
      }
    </style>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03DAC6"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>
  </defs>

  <rect width="800" height="56" rx="8" fill="#0D1117" stroke="#2A1B4E" stroke-width="1"/>
  <text x="20" y="32" class="txt">NEURAL_LINK // ACTIVE</text>

  <!-- Equalizer Bars Left & Right -->
  <g transform="translate(260, 10)" fill="url(#waveGrad)">
    <rect class="bar b1" x="0"   y="4" width="6" height="28" rx="3"/>
    <rect class="bar b2" x="14"  y="4" width="6" height="28" rx="3"/>
    <rect class="bar b3" x="28"  y="4" width="6" height="28" rx="3"/>
    <rect class="bar b4" x="42"  y="4" width="6" height="28" rx="3"/>
    <rect class="bar b5" x="56"  y="4" width="6" height="28" rx="3"/>
    <rect class="bar b6" x="70"  y="4" width="6" height="28" rx="3"/>
    <rect class="bar b7" x="84"  y="4" width="6" height="28" rx="3"/>
    <rect class="bar b2" x="98"  y="4" width="6" height="28" rx="3"/>
    <rect class="bar b4" x="112" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b1" x="126" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b6" x="140" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b3" x="154" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b5" x="168" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b7" x="182" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b2" x="196" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b4" x="210" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b1" x="224" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b5" x="238" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b3" x="252" y="4" width="6" height="28" rx="3"/>
    <rect class="bar b6" x="266" y="4" width="6" height="28" rx="3"/>
  </g>

  <text x="780" y="32" text-anchor="end" class="txt" style="fill:#03DAC6">FREQ: 99.4 Hz</text>
</svg>
