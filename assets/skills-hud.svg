<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <style>
      .title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #BB86FC;
        letter-spacing: 2px;
      }
      .label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        fill: #E2E8F0;
      }
      .pct {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #03DAC6;
      }
      .sub {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        fill: #9D4EDD;
        opacity: 0.85;
      }
      .bar-bg {
        fill: #161B22;
        stroke: #2A1B4E;
        stroke-width: 1;
      }
      .bar-fill {
        transform-origin: left center;
        transform-box: fill-box;
        animation: shimmer 3s ease-in-out infinite alternate;
      }
      .radar-spin {
        transform-origin: 0px 0px;
        animation: spin 8s linear infinite;
      }
      .scanline {
        animation: scan 4.5s linear infinite;
      }
      .pulse-dot {
        animation: pulse 1.8s ease-in-out infinite alternate;
      }

      @keyframes shimmer {
        0%   { opacity: 0.82; }
        100% { opacity: 1; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes scan {
        0%   { transform: translateY(0px); opacity: 0; }
        15%  { opacity: 0.35; }
        85%  { opacity: 0.35; }
        100% { transform: translateY(270px); opacity: 0; }
      }
      @keyframes pulse {
        0%   { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>

    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#130924"/>
    </linearGradient>

    <linearGradient id="gradCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="55%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#03DAC6"/>
    </linearGradient>

    <linearGradient id="gradPinkPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="55%" stop-color="#BB86FC"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03DAC6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#03DAC6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#03DAC6" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="800" height="340" rx="12" fill="url(#hudBg)" stroke="#3B1F6E" stroke-width="1.5"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="800" height="38" rx="12" fill="#160D2B"/>
  <rect x="0" y="26" width="800" height="12" fill="#160D2B"/>
  <line x1="0" y1="38" x2="800" y2="38" stroke="#3B1F6E" stroke-width="1"/>

  <circle class="pulse-dot" cx="22" cy="19" r="5" fill="#FF0080"/>
  <circle cx="40" cy="19" r="5" fill="#BB86FC" opacity="0.7"/>
  <circle cx="58" cy="19" r="5" fill="#03DAC6" opacity="0.7"/>
  <text x="80" y="23" class="title">SHADOW://SKILL_TELEMETRY.SYS</text>
  <text x="776" y="23" text-anchor="end" class="sub">SYNC: LIVE // NODE-012</text>

  <!-- Scanning Beam -->
  <rect class="scanline" x="12" y="44" width="776" height="22" fill="url(#scanBeam)"/>

  <!-- Left Column: Animated Bars -->
  <g transform="translate(26, 66)">
    <!-- 1. Full-Stack -->
    <text x="0" y="12" class="label">Full-Stack Engineering</text>
    <text x="485" y="12" text-anchor="end" class="pct">100%</text>
    <rect x="0" y="20" width="485" height="9" rx="4.5" class="bar-bg"/>
    <rect x="0" y="20" width="485" height="9" rx="4.5" fill="url(#gradCyanPurple)" class="bar-fill" filter="url(#neonGlow)"/>

    <!-- 2. Cloud Architecture -->
    <g transform="translate(0, 38)">
      <text x="0" y="12" class="label">Cloud &amp; Kubernetes Infra</text>
      <text x="485" y="12" text-anchor="end" class="pct">92%</text>
      <rect x="0" y="20" width="485" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="446" height="9" rx="4.5" fill="url(#gradPinkPurple)" class="bar-fill" filter="url(#neonGlow)"/>
    </g>

    <!-- 3. AI / ML -->
    <g transform="translate(0, 76)">
      <text x="0" y="12" class="label">AI / ML &amp; LLM Agents</text>
      <text x="485" y="12" text-anchor="end" class="pct">88%</text>
      <rect x="0" y="20" width="485" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="427" height="9" rx="4.5" fill="url(#gradCyanPurple)" class="bar-fill" filter="url(#neonGlow)"/>
    </g>

    <!-- 4. DevOps / SRE -->
    <g transform="translate(0, 114)">
      <text x="0" y="12" class="label">DevOps, CI/CD &amp; Observability</text>
      <text x="485" y="12" text-anchor="end" class="pct">90%</text>
      <rect x="0" y="20" width="485" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="436" height="9" rx="4.5" fill="url(#gradPinkPurple)" class="bar-fill" filter="url(#neonGlow)"/>
    </g>

    <!-- 5. Cybersecurity -->
    <g transform="translate(0, 152)">
      <text x="0" y="12" class="label">Cybersecurity &amp; AppSec</text>
      <text x="485" y="12" text-anchor="end" class="pct">84%</text>
      <rect x="0" y="20" width="485" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="407" height="9" rx="4.5" fill="url(#gradCyanPurple)" class="bar-fill" filter="url(#neonGlow)"/>
    </g>

    <!-- 6. Low-Level Systems -->
    <g transform="translate(0, 190)">
      <text x="0" y="12" class="label">Systems, Rust &amp; Concurrency</text>
      <text x="485" y="12" text-anchor="end" class="pct">82%</text>
      <rect x="0" y="20" width="485" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="398" height="9" rx="4.5" fill="url(#gradPinkPurple)" class="bar-fill" filter="url(#neonGlow)"/>
    </g>

    <!-- 7. Web3 / Blockchain -->
    <g transform="translate(0, 228)">
      <text x="0" y="12" class="label">Web3, Smart Contracts &amp; Crypto</text>
      <text x="485" y="12" text-anchor="end" class="pct">76%</text>
      <rect x="0" y="20" width="485" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="368" height="9" rx="4.5" fill="url(#gradCyanPurple)" class="bar-fill" filter="url(#neonGlow)"/>
    </g>
  </g>

  <!-- Right Column: Rotating Cyber Radar -->
  <g transform="translate(656, 185)">
    <circle cx="0" cy="0" r="92" fill="#0B0F17" stroke="#2A1B4E" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#2A1B4E" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#3B1F6E" stroke-width="1"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#9D4EDD" stroke-width="1" opacity="0.6"/>
    <line x1="-92" y1="0" x2="92" y2="0" stroke="#2A1B4E" stroke-width="1"/>
    <line x1="0" y1="-92" x2="0" y2="92" stroke="#2A1B4E" stroke-width="1"/>

    <!-- Hexagon Capability Polygon -->
    <polygon points="0,-78 66,-36 62,42 0,72 -58,38 -64,-34" fill="#9D4EDD" fill-opacity="0.22" stroke="#03DAC6" stroke-width="1.8" filter="url(#neonGlow)"/>

    <!-- Radar Sweep -->
    <g class="radar-spin">
      <path d="M 0 0 L 0 -90 A 90 90 0 0 1 64 -64 Z" fill="#03DAC6" opacity="0.16"/>
      <line x1="0" y1="0" x2="0" y2="-90" stroke="#03DAC6" stroke-width="2" opacity="0.85"/>
    </g>

    <!-- Radar Blips -->
    <circle class="pulse-dot" cx="46" cy="-28" r="3.5" fill="#FF0080"/>
    <circle class="pulse-dot" cx="-42" cy="30" r="3" fill="#03DAC6"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>

    <!-- Radar Labels -->
    <text x="0" y="-102" text-anchor="middle" class="sub">FULL-STACK</text>
    <text x="0" y="112" text-anchor="middle" class="sub">SYSTEMS &amp; SEC</text>
    <text x="0" y="128" text-anchor="middle" class="sub" style="fill:#03DAC6">THREAT LEVEL: OMEGA</text>
  </g>
</svg>
