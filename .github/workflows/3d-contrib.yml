name: 3D Contribution Skyline

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D Contributions SVG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: yoshi389111/github-profile-3d-contrib@0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shadowgarden012

      - name: Commit 3D Skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "bot: update 3D contribution skyline"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/shadowgarden012/shadowgarden012.git HEAD:main
