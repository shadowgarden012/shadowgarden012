name: 🐍 Generate Contribution Snake
on:
  schedule:
    - cron: "0 */12 * * *"   # Runs every 12 hours automatically
  workflow_dispatch:           # Allow manual trigger from Actions tab
  push:
    branches:
      - main
jobs:
  generate:
    name: Generate Snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: shadowgarden012
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9D4EDD&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF0080
      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
